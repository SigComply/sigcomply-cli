# Gitleaks configuration for SigComply CLI
# https://github.com/gitleaks/gitleaks

title = "SigComply Gitleaks Configuration"

[extend]
# Use default gitleaks rules as base
useDefault = true

# Custom rules for SigComply-specific patterns
[[rules]]
id = "sigcomply-api-key"
description = "SigComply API Key"
regex = '''(?i)sigcomply[_-]?api[_-]?key\s*[:=]\s*['"]?([a-zA-Z0-9]{32,})['"]?'''
secretGroup = 1
keywords = ["sigcomply"]

[[rules]]
id = "sigcomply-signing-key"
description = "SigComply Signing Key"
regex = '''(?i)sigcomply[_-]?signing[_-]?key\s*[:=]\s*['"]?([a-zA-Z0-9+/]{32,}={0,2})['"]?'''
secretGroup = 1
keywords = ["sigcomply", "signing"]

# Allow rules - files and patterns to ignore. Test files and Markdown are
# scanned like everything else: allow a false positive with an inline
# `gitleaks:allow` comment, or list the fingerprint of one already in
# history in .gitleaksignore. CI fails on any finding (security.yml).
[allowlist]
description = "Global allowlist"

# Files to ignore
paths = [
    '''go\.sum$''',
    '''go\.mod$''',
    '''\.gitleaks\.toml$''',
    '''testdata/.*''',
    '''LICENSE''',
]

# Regex patterns to ignore (for test/example values). Matched against the
# secret, unanchored unless a pattern says otherwise, so a pattern that can
# match a substring of a real token (such as `000+`) hides that token.
# Placeholder patterns are anchored to the whole secret.
regexes = [
    '''AKIA[0-9A-Z]{16}EXAMPLE''',
    '''test[_-]?api[_-]?key''',
    '''example[_-]?token''',
    '''dummy[_-]?secret''',
    '''placeholder''',
    '''your[_-]?.*[_-]?here''',
    '''(?i)^x{3,}$''',
    '''^0{3,}$''',
]

# Commits to ignore (if needed)
commits = []

# Stop words to prevent false positives. A secret containing one is
# ignored. "test" is broad, but dropping it flags only test fixtures and
# resource names in history (sigcomply-e2e-test, a fake JWT), re-checked
# 2026-10-30 with `gitleaks git --redact`.
stopwords = [
    "example",
    "test",
    "dummy",
    "placeholder",
    "sample",
    "fake",
    "mock",
]
