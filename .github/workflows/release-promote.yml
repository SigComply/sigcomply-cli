# Promotes a published prerelease to the latest release, optionally after
# the end-to-end release gate passes. Called by auto-release-pipeline.yml
# and release.yml after they publish a tag as a prerelease; never runs alone.
#
# Customers and the E2E repos resolve releases/latest, so a release reaches
# them only when this workflow promotes it.
#
#   vars.RELEASE_GATE == 'on': dispatch release-gate.yml in the GitHub E2E
#     repo for this exact tag, wait for it, and promote only when it passes.
#     A cancelled gate run is dispatched once more; a second cancel, a
#     failure or a timeout fails the gate.
#     A missing E2E_GATE_TOKEN fails the gate, and the release stays a
#     prerelease.
#   anything else: promote at once and warn that the release was not gated.
#
# The callers hold the `release` concurrency group for the whole chain, so
# this workflow must not declare the same group (it would deadlock).

name: Release Promote

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to gate and promote, e.g. v1.2.3
        type: string
        required: true
    secrets:
      E2E_GATE_TOKEN:
        description: Token with Actions read/write on the GitHub E2E repo
        required: false

permissions: {}

env:
  E2E_REPO: SigComply/sigcomply-cli-testing-project-github
  GATE_WORKFLOW: release-gate.yml

jobs:
  e2e-gate:
    name: E2E Release Gate
    if: vars.RELEASE_GATE == 'on'
    runs-on: ubuntu-latest
    # Two attempts, each up to 10 minutes to appear and 60 to finish.
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.E2E_GATE_TOKEN }}
      TAG: ${{ inputs.tag }}
      CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Require the gate token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_GATE is on but the E2E_GATE_TOKEN secret is not set. $TAG stays a prerelease."
            exit 1
          fi

      # One attempt: dispatch, find the run by its correlation ID, wait.
      # A cancelled gate run (the E2E repo's AWS concurrency group, or a
      # person, cancelled it) says nothing about the release, so it is
      # dispatched once more with a new ID. A failed or timed-out run fails
      # the gate at once.
      - name: Run the release gate
        run: |
          for attempt in 1 2; do
            id="${CORRELATION_ID}-a${attempt}"
            gh workflow run "$GATE_WORKFLOW" --repo "$E2E_REPO" \
              -f cli_version="$TAG" -f correlation_id="$id"

            # The gate's run-name ends with " <correlation ID>"; a dispatch
            # does not return the run it created. Match the whole ID after
            # the space, so ID 5-1-a1 never picks the run of ID 15-1-a1.
            run_id=""
            for _ in $(seq 1 40); do
              # jq (on every runner) rather than gh --jq, which has no --arg.
              run_id=$(gh run list --repo "$E2E_REPO" --workflow "$GATE_WORKFLOW" \
                --event workflow_dispatch --limit 30 --json databaseId,displayTitle \
                | jq -r --arg id "$id" \
                  '[.[] | select(.displayTitle | endswith(" " + $id))][0].databaseId // empty')
              [ -n "$run_id" ] && break
              sleep 15
            done
            if [ -z "$run_id" ]; then
              echo "::error::No $GATE_WORKFLOW run with correlation ID $id appeared in $E2E_REPO within 10 minutes."
              exit 1
            fi
            url="https://github.com/$E2E_REPO/actions/runs/$run_id"
            echo "Release gate run (attempt $attempt): $url"
            {
              echo "## E2E release gate for $TAG, attempt $attempt"
              echo ""
              echo "$url"
            } >> "$GITHUB_STEP_SUMMARY"

            if timeout 60m gh run watch "$run_id" --repo "$E2E_REPO" --exit-status --interval 30; then
              exit 0
            else
              rc=$?
            fi
            if [ "$rc" -eq 124 ]; then
              echo "::error::The release gate run did not finish within 60 minutes: $url"
              exit 1
            fi
            conclusion=$(gh run view "$run_id" --repo "$E2E_REPO" --json conclusion --jq .conclusion || true)
            if [ "$conclusion" = "cancelled" ] && [ "$attempt" -eq 1 ]; then
              echo "::warning::The release gate run was cancelled; dispatching it once more."
              continue
            fi
            echo "::error::The release gate run concluded '${conclusion:-unknown}': $url"
            exit 1
          done

  promote:
    name: Promote to Latest
    needs: e2e-gate
    # Runs when the gate passed, or when the gate is off (skipped). A
    # failed or cancelled gate leaves the release a prerelease.
    if: >-
      !cancelled() &&
      (needs.e2e-gate.result == 'success' ||
       (vars.RELEASE_GATE != 'on' && needs.e2e-gate.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      GATE: ${{ vars.RELEASE_GATE }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Warn when not gated
        if: vars.RELEASE_GATE != 'on'
        run: |
          echo "::warning::$TAG was promoted without the E2E release gate (repository variable RELEASE_GATE is not 'on')."

      - name: Promote the prerelease
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "Promoted $TAG to latest (gate: ${GATE:-off})" >> "$GITHUB_STEP_SUMMARY"
