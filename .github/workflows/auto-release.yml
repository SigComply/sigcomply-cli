# Auto-release workflow for SigComply CLI
# Bumps version, creates a tag, and runs GoReleaser on every push to main
# whose test suite is green.
#
# The gate is not optional decoration. The E2E repos install
# releases/latest and resolve it at run time, so an ungated tag reaches
# them the moment it is pushed. Calling test.yml (rather than racing it,
# or chaining off workflow_run) keeps the push event — and with it
# head_commit.message for the [skip release] marker, paths-ignore, and a
# checkout of the exact commit that was pushed.
# Uses conventional commit prefixes to determine version bump:
#   feat: -> minor bump
#   fix:, refactor:, perf:, etc. -> patch bump
#   BREAKING CHANGE in body -> major bump
#
# Build provenance attestations are generated for all release artifacts.
# Customers can verify with: gh attestation verify <binary> --repo SigComply/sigcomply-cli

name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  # Manual escape hatch for a release that was missed — a push whose only
  # changes were path-ignored, or one whose commit body tripped the skip
  # marker. There is no head_commit on a dispatch, so the skip condition
  # is vacuously false and the release proceeds.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Must pass before anything is tagged.
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    # A called workflow cannot exceed the caller's grant, and test.yml's
    # unit-tests job asks for pull-requests: write for its coverage comment.
    permissions:
      contents: read
      pull-requests: write

  auto-release:
    name: Version Bump and Build
    runs-on: ubuntu-latest
    needs: test
    if: "!contains(github.event.head_commit.message, '[skip release]') && !contains(github.event.head_commit.message, 'chore(release)')"
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      latest_tag: ${{ steps.bump.outputs.latest_tag }}
      bump: ${{ steps.bump.outputs.bump }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          # Get the latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

          # Parse current version
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Analyze commits since last tag to determine bump type
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "BREAKING CHANGE|^[a-z]+(\(.*\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.*\))?:"; then
            BUMP="minor"
          fi

          # Calculate new version
          case $BUMP in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Version bump: ${BUMP} (${LATEST_TAG} -> ${NEW_TAG})"

      - name: Create and push tag
        id: tag
        run: |
          NEW_TAG="${{ steps.bump.outputs.new_tag }}"

          # Check if tag already exists
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created and pushed tag: $NEW_TAG"

      - name: Set up Go
        if: steps.tag.outputs.created == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser (build only, skip publish)
        if: steps.tag.outputs.created == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          # --parallelism 2: nine cross-compile targets at the runner's
          # default (one per vCPU) peak around 2.8 GB each and OOM-kill the
          # job silently mid-build. Two at a time fits comfortably.
          args: release --clean --skip=publish --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.bump.outputs.new_tag }}

      - name: Upload build artifacts
        if: steps.tag.outputs.created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest Artifacts
    needs: auto-release
    if: needs.auto-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # required to sign attestations with OIDC
      attestations: write  # required to store attestations
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Publish Release
    needs: [auto-release, attest]
    if: needs.auto-release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.auto-release.outputs.new_tag }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "SigComply CLI $TAG" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/checksums.txt

  summary:
    name: Release Summary
    needs: [auto-release, attest, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Write summary
        run: |
          echo "## Auto Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Previous | ${{ needs.auto-release.outputs.latest_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New | ${{ needs.auto-release.outputs.new_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump | ${{ needs.auto-release.outputs.bump }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag Created | ${{ needs.auto-release.outputs.created }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Attestation | ${{ needs.attest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Published | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
