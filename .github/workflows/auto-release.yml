# Auto-release workflow for SigComply CLI
# On every push to main whose test suite is green, and whose head commit
# does not carry the skip marker, run auto-release-pipeline.yml: bump the
# version, build, attest, push the tag, publish a prerelease, then gate and
# promote it to latest (release-promote.yml).
#
# The test gate is not optional decoration. Calling test.yml (rather than
# racing it, or chaining off workflow_run) keeps the push event, and with it
# head_commit.message for the [skip release] marker, paths-ignore, and a
# checkout of the exact commit that was pushed.

name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claude/**'
      - '.vale/**'
      - '.vale.ini'
      - '.github/workflows/docs-lint.yml'
  # Manual escape hatch for a release that was missed — a push whose only
  # changes were path-ignored, or one whose commit body tripped the skip
  # marker. There is no head_commit on a dispatch, so the skip condition
  # is vacuously false and the release proceeds.
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency: tests run for every push in parallel. Only
# the release job below is serialised.

jobs:
  # Must pass before anything is tagged.
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    # A called workflow cannot exceed the caller's grant, and test.yml's
    # unit-tests job asks for pull-requests: write for its coverage comment.
    permissions:
      contents: read
      pull-requests: write

  release:
    name: Release
    needs: test
    # A skipped job never takes the concurrency group, so a red test run or
    # a [skip release] push cannot displace a release waiting for the group.
    # A path-ignored push starts no run at all.
    # The ref guard stops a workflow_dispatch from another branch from
    # releasing that branch (scripts/release_workflows_test.go).
    if: "!contains(github.event.head_commit.message, '[skip release]') && !contains(github.event.head_commit.message, 'chore(release)') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))"
    # One release at a time, from version bump to promotion. The group is
    # shared with release.yml. This job holds it for the whole called
    # pipeline, so two runs never compute the same version.
    #
    # GitHub keeps one running and at most one pending job per group. When a
    # third arrives, the pending one is cancelled, whatever cancel-in-progress
    # says; a running release is never cancelled. Losing a pending
    # auto-release is safe: the newer run checks out a later commit of main,
    # which contains the cancelled run's commits, and its version bump reads
    # every commit since the last final tag, so they ship in its release. It
    # is not safe for a pending release.yml dispatch (see that file).
    concurrency:
      group: release
      cancel-in-progress: false
    uses: ./.github/workflows/auto-release-pipeline.yml
    secrets:
      E2E_GATE_TOKEN: ${{ secrets.E2E_GATE_TOKEN }}
    permissions:
      contents: write      # push the tag, publish and promote the release
      id-token: write      # sign build provenance
      attestations: write  # store build provenance
