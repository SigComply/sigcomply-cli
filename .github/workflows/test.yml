name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by auto-release.yml so a release is gated on this suite.
  # The push trigger stays: a docs-only push is path-ignored by
  # auto-release and would otherwise run no tests at all, and
  # TestDocFiguresMatchCode pins catalog counts into the docs.
  workflow_call:

permissions:
  contents: read

env:
  # Hard floor enforced in CI. Raise as coverage improves; never lower silently.
  COVERAGE_THRESHOLD: 80

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # for the "Add coverage comment to PR" step
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Privacy gate: fail fast if any fixture/contract leaks real secrets or
      # identity instead of the §4 placeholders (docs/architecture/11-testing-strategy.md).
      - name: Check fixtures for leaked secrets/PII
        run: scripts/check-fixtures.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # Full suite (no -short): also runs the heavy `sigcomply build` tests that
      # compile a tailored binary. Those are -short-skipped locally for speed but
      # MUST run somewhere — this is that somewhere.
      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage threshold
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Total coverage: $COVERAGE% (threshold: ${COVERAGE_THRESHOLD}%)"
          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below the ${COVERAGE_THRESHOLD}% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        continue-on-error: true

      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE: ${{ steps.coverage.outputs.coverage }}
        with:
          script: |
            const coverage = process.env.COVERAGE;
            const threshold = process.env.COVERAGE_THRESHOLD;
            const emoji = parseFloat(coverage) >= parseFloat(threshold) ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${emoji} Test Coverage: ${coverage}%\n\nThreshold: ${threshold}%`
            });

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocking, and this job gates every release (auto-release.yml and
      # release.yml call this workflow). actionlint checks the workflows and
      # runs shellcheck over their `run:` scripts; the second command checks
      # every committed shell script. Both tools are checksum-pinned; bump a
      # version and its sha256 together.
      - name: Install actionlint and shellcheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint workflows (actionlint)
        run: actionlint -shellcheck "$RUNNER_TEMP/bin/shellcheck"

      - name: Lint shell scripts (shellcheck)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/sigcomply-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigcomply-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/sigcomply-*

  # Summary job that other workflows can depend on
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, lint, build]
    if: always()
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check test results
        env:
          UNIT: ${{ needs.unit-tests.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          {
            echo "## Test Results Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Unit Tests | $UNIT |"
            echo "| Lint | $LINT |"
            echo "| Build | $BUILD |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$UNIT" == "failure" ]] || [[ "$LINT" == "failure" ]] || [[ "$BUILD" == "failure" ]]; then
            echo "❌ Some checks failed!" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ All checks passed!" >> "$GITHUB_STEP_SUMMARY"
