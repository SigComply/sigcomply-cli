# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    reviewers:
      - "sigcomply/maintainers"
    # Group minor and patch updates together
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      testing:
        patterns:
          - "github.com/stretchr/testify"
          - "github.com/golang/mock"
    ignore:
      # L2 cassettes replay real responses through the SDK deserializer, so a
      # cassette is only meaningful at the api-version it was recorded at. These
      # three SDKs move their default api-version on minor releases; per the
      # testing strategy (docs/architecture/11-testing-strategy.md, section 7),
      # such a bump must ride along with a deliberate live re-record of the
      # cassette, never an edit of its URL. They are held until then:
      #   armcontainerservice/v9 at v9.6.0 (managedClusters 2026-07-01;
      #     v9.7.0 moves to 2026-08-01) - aks/testdata/cassettes/clusters.yaml
      #   armstorage/v4 at v4.2.0 (storageAccounts, blobServices 2026-06-01;
      #     v4.3.0 moves to 2026-09-01) - storage/testdata/cassettes/accounts.yaml
      #   armrecoveryservicesbackup/v5 at v5.1.0 (backupPolicies 2026-08-01;
      #     v5.2.0 moves to 2026-10-01) - backup/testdata/cassettes/plans.yaml
      # Minor and major bumps are ignored; patch releases keep the api-version
      # and still flow. Re-record, bump, then drop the matching entry. The
      # scheduled L3 contract-drift job still watches the vendor specs, and
      # OSV/dependency review still cover these modules for vulnerabilities.
      - dependency-name: "github.com/Azure/azure-sdk-for-go/sdk/resourcemanager/containerservice/armcontainerservice/v9"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "github.com/Azure/azure-sdk-for-go/sdk/resourcemanager/storage/armstorage/v4"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "github.com/Azure/azure-sdk-for-go/sdk/resourcemanager/recoveryservices/armrecoveryservicesbackup/v5"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # OPA still requires gobwas/glob v0.2.3; v1.0.0 renamed the API and does
      # not compile against it.
      - dependency-name: "github.com/gobwas/glob"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

