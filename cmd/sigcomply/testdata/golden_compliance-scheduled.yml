# Generated by `sigcomply init-ci`. Customize freely.
# Runs every day at 02:00 UTC (and on demand). `sigcomply check
# --scheduled` re-evaluates each policy whose cadence has come due and
# carries the rest forward from the vault's state, so every run covers
# every policy. This is the run SigComply Cloud receives when
# `cloud.base_url` is set; it also needs `cloud.project_id` (copy it from
# your project's page on the SigComply dashboard) or it exits 3. Keep the
# vault in durable storage (s3, gcs or azure_blob): with a local vault
# each CI run starts from no state and re-evaluates everything.
name: Compliance — Scheduled

on:
  schedule:
    - cron: '0 2 * * *'    # 02:00 UTC every day
  workflow_dispatch:

permissions:
  id-token: write    # for OIDC role assumption + SigComply Cloud submission
  contents: read

env:
  SIGCOMPLY_VERSION: v1.2.3    # release tag to install (pin one for repeatable runs), or "latest"
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::000000000000:role/REPLACE_ME

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SigComply CLI
        run: |
          set -eu
          version="${SIGCOMPLY_VERSION:-latest}"
          if [ "$version" = "latest" ]; then
            tag=$(curl -fsSL https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
          else
            tag="$version"
          fi
          ver="${tag#v}"
          asset="sigcomply_${ver}_linux_amd64.tar.gz"
          base="https://github.com/SigComply/sigcomply-cli/releases/download/${tag}"
          curl -fsSL "${base}/${asset}" -o "/tmp/${asset}"
          curl -fsSL "${base}/checksums.txt" -o /tmp/checksums.txt
          # Verify against the release's checksums before extracting anything.
          (cd /tmp && grep "  ${asset}\$" checksums.txt | sha256sum -c -)
          sudo tar -xzf "/tmp/${asset}" -C /usr/local/bin sigcomply
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: https://api.sigcomply.com
      - name: Run SigComply
        run: sigcomply check --scheduled

      # Advisory only. Lists manual-evidence entries whose folder for the
      # current period is still empty. Until a file is uploaded, the
      # matching policy fails in every scheduled run. Read-only (LIST calls
      # only) and always exits 0; continue-on-error keeps it from failing
      # the job even if the config is wrong.
      - name: Manual evidence due soon
        if: always()
        continue-on-error: true
        run: sigcomply evidence due --within-days 30
