# Generated by `sigcomply init-ci`. Customize freely.
# Daily cadence: most automated checks (MFA enforced, encryption at rest,
# log forwarding, etc.) live here.
name: Compliance — Daily

on:
  schedule:
    - cron: '0 2 * * *'    # 02:00 UTC every day
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  SIGCOMPLY_VERSION: v1.2.3    # release tag to install (pin one for repeatable runs), or "latest"
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::000000000000:role/REPLACE_ME

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SigComply CLI
        run: |
          set -eu
          version="${SIGCOMPLY_VERSION:-latest}"
          if [ "$version" = "latest" ]; then
            tag=$(curl -fsSL https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
          else
            tag="$version"
          fi
          ver="${tag#v}"
          curl -fsSL "https://github.com/SigComply/sigcomply-cli/releases/download/${tag}/sigcomply_${ver}_linux_amd64.tar.gz" -o /tmp/sigcomply.tar.gz
          tar -xzf /tmp/sigcomply.tar.gz -C /usr/local/bin sigcomply
          chmod +x /usr/local/bin/sigcomply
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: https://api.sigcomply.com
      - name: Run SigComply
        run: sigcomply check --cadence daily

      # Advisory only. Lists manual-evidence entries whose folder for the
      # current period is still empty, so the upload happens before a
      # cadence run needs it. Read-only (LIST calls only) and always exits
      # 0; continue-on-error keeps it structurally incapable of failing
      # the job even if the config is wrong.
      - name: Manual evidence due soon
        if: always()
        continue-on-error: true
        run: sigcomply evidence due --within-days 30
