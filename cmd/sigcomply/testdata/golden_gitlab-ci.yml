# Generated by `sigcomply init-ci`. Customize freely.
#
# How this works:
#   - `compliance:on_push` runs `sigcomply check --on-push` on merge
#     requests and on pushes to the default branch.
#   - The cadence jobs run on GitLab pipeline schedules. Create one
#     schedule per cadence under Settings > CI/CD > Pipeline schedules and
#     set its `CADENCE` variable to daily, weekly, monthly, quarterly or
#     annual. Each job runs `sigcomply check --cadence <CADENCE>`; the
#     daily job also lists manual evidence that is due soon.
#
# OIDC: `id_tokens` mints SIGCOMPLY_ID_TOKEN, a GitLab JWT with audience
# `https://api.sigcomply.com`. It is used twice:
#   - The CLI sends it to SigComply Cloud when `cloud.base_url` is set in
#     .sigcomply.yaml. Without that key nothing is submitted.
#   - `before_script` writes it to a private temp file and exports
#     AWS_WEB_IDENTITY_TOKEN_FILE. With AWS_ROLE_ARN, the AWS SDK then
#     assumes that role with web identity. The IAM OIDC provider for your
#     GitLab host and the role's trust policy must accept the audience
#     `https://api.sigcomply.com`.
# Replace the AWS_ROLE_ARN placeholder below.

variables:
  SIGCOMPLY_VERSION: "v1.2.3"   # release tag to install (pin one for repeatable runs), or "latest"
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::000000000000:role/REPLACE_ME"

.sigcomply_base:
  image: ubuntu:24.04
  id_tokens:
    SIGCOMPLY_ID_TOKEN:
      aud: https://api.sigcomply.com
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl jq ca-certificates
    - |
      version="${SIGCOMPLY_VERSION:-latest}"
      if [ "$version" = "latest" ]; then
        tag=$(curl -fsSL https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
      else
        tag="$version"
      fi
      ver="${tag#v}"
      curl -fsSL "https://github.com/SigComply/sigcomply-cli/releases/download/${tag}/sigcomply_${ver}_linux_amd64.tar.gz" -o /tmp/sigcomply.tar.gz
      tar -xzf /tmp/sigcomply.tar.gz -C /usr/local/bin sigcomply
      chmod +x /usr/local/bin/sigcomply
    # AWS web identity: the SDK's default credential chain assumes
    # AWS_ROLE_ARN with the token in this file. before_script and script
    # share one shell, so the export reaches `sigcomply`. Skipped when
    # AWS_ROLE_ARN is empty: a set token file would override a runner's
    # instance role. mktemp creates the file mode 0600 in the job's temp
    # directory; the token is never printed.
    - |
      if [ -n "${AWS_ROLE_ARN:-}" ]; then
        AWS_WEB_IDENTITY_TOKEN_FILE="$(mktemp)"
        printf '%s' "$SIGCOMPLY_ID_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
        export AWS_WEB_IDENTITY_TOKEN_FILE
      fi

compliance:on_push:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - sigcomply check --on-push

compliance:daily:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CADENCE == "daily"'
  script:
    - sigcomply check --cadence daily
    # Advisory only: lists manual-evidence entries whose folder for the
    # current period is still empty, so the upload happens before a cadence
    # run needs it. Read-only and always exits 0; `|| true` keeps it from
    # affecting the job even on a config error.
    - sigcomply evidence due --within-days 30 || true

compliance:weekly:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CADENCE == "weekly"'
  script:
    - sigcomply check --cadence weekly

compliance:monthly:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CADENCE == "monthly"'
  script:
    - sigcomply check --cadence monthly

compliance:quarterly:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CADENCE == "quarterly"'
  script:
    - sigcomply check --cadence quarterly

compliance:annual:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CADENCE == "annual"'
  script:
    - sigcomply check --cadence annual
