# Generated by `sigcomply init-ci`. Customize freely.
#
# How this works:
#   - `compliance:scheduled` runs `sigcomply check --scheduled` on a
#     GitLab pipeline schedule. Create one schedule under Settings > CI/CD >
#     Pipeline schedules, for example daily at 02:00 UTC (`0 2 * * *`).
#     Each run re-evaluates the policies whose cadence has come due and
#     carries the rest forward from the vault's state, so every run covers
#     every policy; it is the run SigComply Cloud receives. It also lists
#     manual evidence whose folder for the current period is still empty.
#     Keep the vault in durable storage (s3, gcs or azure_blob): with a
#     local vault each run starts from no state and re-evaluates everything.
#   - `compliance:on_push` runs `sigcomply check --pr` on merge requests
#     and on pushes to the default branch: the on_push policies only. It
#     never submits to SigComply Cloud and never advances cadence state.
#
# OIDC: `id_tokens` mints two GitLab JWTs, one per receiver:
#   - SIGCOMPLY_ID_TOKEN, audience `https://api.sigcomply.com`. The CLI
#     sends it to SigComply Cloud when `cloud.base_url` is set in
#     .sigcomply.yaml. Without that key nothing is submitted. Also set
#     `cloud.project_id` (copy it from your project's page on the
#     SigComply dashboard): a run that submits exits 3 without it.
#   - AWS_ID_TOKEN, audience `sts.amazonaws.com`. `before_script` writes
#     it to a private temp file and exports AWS_WEB_IDENTITY_TOKEN_FILE.
#     With AWS_ROLE_ARN, the AWS SDK then assumes that role with web
#     identity. The IAM OIDC provider for your GitLab host and the role's
#     trust policy accept `sts.amazonaws.com` only: a role that trusts
#     `https://api.sigcomply.com` trusts a token SigComply Cloud receives.
# Each job assumes its own role. Replace both placeholders below: the
# scheduled role trusts only the default branch; the on-push role runs on
# merge requests from any branch, so it can't write the vault's state/.

variables:
  SIGCOMPLY_VERSION: "__SIGCOMPLY_VERSION__"   # release tag to install (pin one for repeatable runs), or "latest"
  AWS_REGION: "us-east-1"
  SIGCOMPLY_SCHEDULED_ROLE_ARN: "arn:aws:iam::000000000000:role/REPLACE_ME"   # trusts the default branch only
  SIGCOMPLY_ON_PUSH_ROLE_ARN: "arn:aws:iam::000000000000:role/REPLACE_ME"     # trusts every branch; no state/ writes

.sigcomply_base:
  image: ubuntu:24.04
  id_tokens:
    # For SigComply Cloud: the CLI submits with it.
    SIGCOMPLY_ID_TOKEN:
      aud: https://api.sigcomply.com
    # For AWS: the role's trust policy accepts only this audience.
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl jq ca-certificates
    - |
      version="${SIGCOMPLY_VERSION:-latest}"
      if [ "$version" = "latest" ]; then
        tag=$(curl -fsSL https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
      else
        tag="$version"
      fi
      ver="${tag#v}"
      asset="sigcomply_${ver}_linux_amd64.tar.gz"
      base="https://github.com/SigComply/sigcomply-cli/releases/download/${tag}"
      curl -fsSL "${base}/${asset}" -o "/tmp/${asset}"
      curl -fsSL "${base}/checksums.txt" -o /tmp/checksums.txt
      # Verify against the release's checksums before extracting anything.
      (cd /tmp && grep "  ${asset}\$" checksums.txt | sha256sum -c -)
      # Optional: also verify the build provenance (no token). Needs git and a
      # recent GitHub CLI (gh) in the image; see the install guide:
      # https://github.com/SigComply/sigcomply-cli/blob/main/docs/guides/install.md
      # bundle="sigcomply_${ver}_provenance.sigstore.json"
      # curl -fsSL "${base}/${bundle}" -o "/tmp/${bundle}" \
      #   || { echo "${tag} has no ${bundle}: pin v0.91.0 or later" >&2; exit 1; }
      # commit=$(git ls-remote https://github.com/SigComply/sigcomply-cli "refs/tags/${tag}^{}" | cut -f1)
      # gh attestation verify "/tmp/${asset}" --bundle "/tmp/${bundle}" \
      #   --repo SigComply/sigcomply-cli --source-digest "${commit:?cannot resolve ${tag}}" \
      #   --cert-identity-regex '^https://github\.com/SigComply/sigcomply-cli/\.github/workflows/(auto-release-pipeline|release)\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$' \
      #   --deny-self-hosted-runners
      tar -xzf "/tmp/${asset}" -C /usr/local/bin sigcomply
    # AWS web identity: the SDK's default credential chain assumes
    # AWS_ROLE_ARN (each job sets it from its own role variable) with the
    # AWS_ID_TOKEN in this file. before_script and script share one shell,
    # so the export reaches `sigcomply`. Skipped when AWS_ROLE_ARN is
    # empty: a set token file would override a runner's instance role.
    # mktemp creates the file mode 0600 in the job's temp directory; the
    # token is never printed.
    - |
      if [ -n "${AWS_ROLE_ARN:-}" ]; then
        AWS_WEB_IDENTITY_TOKEN_FILE="$(mktemp)"
        printf '%s' "$AWS_ID_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
        export AWS_WEB_IDENTITY_TOKEN_FILE
      fi

compliance:on_push:
  extends: .sigcomply_base
  stage: test
  variables:
    AWS_ROLE_ARN: $SIGCOMPLY_ON_PUSH_ROLE_ARN
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - sigcomply check --pr

compliance:scheduled:
  extends: .sigcomply_base
  stage: test
  variables:
    AWS_ROLE_ARN: $SIGCOMPLY_SCHEDULED_ROLE_ARN
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - sigcomply check --scheduled
    # Advisory only: lists manual-evidence entries whose folder for the
    # current period is still empty; until a file is uploaded, the matching
    # policy fails in every scheduled run. Read-only and always exits 0;
    # `|| true` keeps it from affecting the job even on a config error.
    - sigcomply evidence due --within-days 30 || true
