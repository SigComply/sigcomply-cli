# Generated by `sigcomply init-ci`. Customize freely.
# Quarterly cadence: access reviews, vendor risk assessments.
#
# The cron fires a few days BEFORE each quarter closes, not on the
# boundary. The audit period is derived from the HEAD commit's timestamp,
# so a run on the 1st of a quarter can land in the newly-opened period,
# whose manual-evidence folder cannot legitimately hold anything yet.
# Firing inside the quarter makes the period unambiguous and still leaves
# the whole quarter available for uploads. Run `sigcomply evidence due`
# (wired into compliance-daily.yml) to see what is outstanding.
name: Compliance — Quarterly

on:
  schedule:
    - cron: '0 2 20 3,6,9,12 *'    # 02:00 UTC on Mar 20, Jun 20, Sep 20, Dec 20
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  SIGCOMPLY_VERSION: v0.73.2    # pinned release; bump to a newer tag, or set to "latest" for the newest
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::000000000000:role/REPLACE_ME

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SigComply CLI
        run: |
          set -eu
          version="${SIGCOMPLY_VERSION:-latest}"
          if [ "$version" = "latest" ]; then
            tag=$(curl -fsSL https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
          else
            tag="$version"
          fi
          ver="${tag#v}"
          curl -fsSL "https://github.com/SigComply/sigcomply-cli/releases/download/${tag}/sigcomply_${ver}_linux_amd64.tar.gz" -o /tmp/sigcomply.tar.gz
          tar -xzf /tmp/sigcomply.tar.gz -C /usr/local/bin sigcomply
          chmod +x /usr/local/bin/sigcomply
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: https://api.sigcomply.com
      - name: Run SigComply
        run: sigcomply check --cadence quarterly
