# Generated by `sigcomply init-ci`. Customize freely.
# Runs on pull requests and on pushes to main. `sigcomply check --pr`
# evaluates the policies whose `on_push` attribute is true (fast,
# change-sensitive automated checks; no manual evidence). A --pr run
# writes its results to the vault but never submits to SigComply Cloud
# and never advances the cadence state the scheduled workflow reads.
name: Compliance — On Push

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write    # for OIDC role assumption
  contents: read

env:
  SIGCOMPLY_VERSION: __SIGCOMPLY_VERSION__    # release tag to install (pin one for repeatable runs), or "latest"
  AWS_REGION: us-east-1
  # The on-push role: trusts pull requests and main, can't write state/.
  AWS_ROLE_ARN: arn:aws:iam::000000000000:role/REPLACE_ME

jobs:
  check:
    # A pull request from a fork gets no OIDC token, so the AWS role and
    # the Cloud submission would fail on every one. Run on pushes and on
    # pull requests from branches of this repository only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SigComply CLI
        run: |
          set -eu
          version="${SIGCOMPLY_VERSION:-latest}"
          if [ "$version" = "latest" ]; then
            tag=$(curl -fsSL https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
          else
            tag="$version"
          fi
          ver="${tag#v}"
          asset="sigcomply_${ver}_linux_amd64.tar.gz"
          base="https://github.com/SigComply/sigcomply-cli/releases/download/${tag}"
          curl -fsSL "${base}/${asset}" -o "/tmp/${asset}"
          curl -fsSL "${base}/checksums.txt" -o /tmp/checksums.txt
          # Verify against the release's checksums before extracting anything.
          (cd /tmp && grep "  ${asset}\$" checksums.txt | sha256sum -c -)
          # Verify the build provenance (no token): the archive must have been
          # built by SigComply's release workflow on a GitHub-hosted runner,
          # from the commit the tag points at. A mismatch fails the job.
          bundle="sigcomply_${ver}_provenance.sigstore.json"
          curl -fsSL "${base}/${bundle}" -o "/tmp/${bundle}" \
            || { echo "${tag} has no ${bundle}: pin v0.91.0 or later" >&2; exit 1; }
          commit=$(git ls-remote https://github.com/SigComply/sigcomply-cli "refs/tags/${tag}^{}" | cut -f1)
          gh attestation verify "/tmp/${asset}" --bundle "/tmp/${bundle}" \
            --repo SigComply/sigcomply-cli --source-digest "${commit:?cannot resolve ${tag}}" \
            --cert-identity-regex '^https://github\.com/SigComply/sigcomply-cli/\.github/workflows/(auto-release-pipeline|release)\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$' \
            --deny-self-hosted-runners
          sudo tar -xzf "/tmp/${asset}" -C /usr/local/bin sigcomply
      # AWS gets its own OIDC token, with AWS's audience. The CLI mints a
      # separate token for SigComply Cloud (https://api.sigcomply.com);
      # never let an AWS role trust that audience.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Run SigComply
        run: sigcomply check --pr
