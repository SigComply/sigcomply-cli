# SigComply CLI - GitLab CI Example
#
# A hand-written GitLab CI pipeline for SigComply compliance checks. The
# recommended path is `sigcomply init-ci --ci gitlab`, which writes the
# same jobs pinned to the CLI release you ran it with (`latest` from a
# development build).
#
# How it works:
#   - `compliance:scheduled` runs `sigcomply check --scheduled` on a
#     GitLab pipeline schedule. Create one schedule under Settings → CI/CD →
#     Pipeline schedules, daily (for example `0 2 * * *`). Policies whose
#     cadence has not come due carry forward from the vault's state, so
#     each run covers every policy; it is the run SigComply Cloud receives.
#     Keep the vault in durable storage (s3, gcs or azure_blob).
#   - `compliance:on_push` runs `sigcomply check --pr` on merge requests
#     and pushes to the default branch: the on_push policies only, never
#     submitted to SigComply Cloud.
#
# The framework is read from `framework:` in `.sigcomply.yaml` — there is
# no `--framework` flag on `check`. Exit codes: 0 pass, 1 violations,
# 2 execution error, 3 config error. Violations fail the job by default;
# set `ci.fail_on_violation: false` in .sigcomply.yaml to keep it green.
#
# OIDC: `id_tokens` mints SIGCOMPLY_ID_TOKEN, a GitLab JWT with audience
# `https://api.sigcomply.com`. It is used twice:
#   - The CLI sends it to SigComply Cloud when `cloud.base_url:
#     https://sigcomply.com` is set in .sigcomply.yaml. Without that key
#     nothing is submitted. Also set `cloud.project_id` (copy it from your
#     project's page on the SigComply dashboard).
#   - `before_script` writes it to a private temp file and exports
#     AWS_WEB_IDENTITY_TOKEN_FILE. With AWS_ROLE_ARN, the AWS SDK then
#     assumes that role with web identity. The IAM OIDC provider for your
#     GitLab host and the role's trust policy must accept the audience
#     `https://api.sigcomply.com`.
# Replace the AWS_ROLE_ARN placeholder below.

variables:
  # "latest" installs the newest release on every run. Pin a release tag
  # (vX.Y.Z, see https://github.com/SigComply/sigcomply-cli/releases) for
  # repeatable runs, and bump it when you upgrade.
  SIGCOMPLY_VERSION: "latest"
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::000000000000:role/REPLACE_ME"

.sigcomply_base:
  image: ubuntu:24.04
  id_tokens:
    SIGCOMPLY_ID_TOKEN:
      aud: https://api.sigcomply.com
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl jq ca-certificates
    - |
      version="${SIGCOMPLY_VERSION:-latest}"
      if [ "$version" = "latest" ]; then
        tag=$(curl -fsSL https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
      else
        tag="$version"
      fi
      ver="${tag#v}"
      asset="sigcomply_${ver}_linux_amd64.tar.gz"
      base="https://github.com/SigComply/sigcomply-cli/releases/download/${tag}"
      curl -fsSL "${base}/${asset}" -o "/tmp/${asset}"
      curl -fsSL "${base}/checksums.txt" -o /tmp/checksums.txt
      # Verify against the release's checksums before extracting anything.
      (cd /tmp && grep "  ${asset}\$" checksums.txt | sha256sum -c -)
      # Optional: also verify the build provenance, offline. Needs git and a
      # recent GitHub CLI (gh) in the image; see the install guide:
      # https://github.com/SigComply/sigcomply-cli/blob/main/docs/guides/install.md
      # bundle="sigcomply_${ver}_provenance.sigstore.json"
      # curl -fsSL "${base}/${bundle}" -o "/tmp/${bundle}"
      # commit=$(git ls-remote https://github.com/SigComply/sigcomply-cli "refs/tags/${tag}^{}" | cut -f1)
      # gh attestation verify "/tmp/${asset}" --bundle "/tmp/${bundle}" \
      #   --repo SigComply/sigcomply-cli --source-digest "${commit:?cannot resolve ${tag}}" \
      #   --cert-identity-regex '^https://github\.com/SigComply/sigcomply-cli/\.github/workflows/(auto-release-pipeline|release)\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$' \
      #   --deny-self-hosted-runners
      tar -xzf "/tmp/${asset}" -C /usr/local/bin sigcomply
    # AWS web identity: the SDK's default credential chain assumes
    # AWS_ROLE_ARN with the token in this file. before_script and script
    # share one shell, so the export reaches `sigcomply`. Skipped when
    # AWS_ROLE_ARN is empty: a set token file would override a runner's
    # instance role. mktemp creates the file mode 0600 in the job's temp
    # directory; the token is never printed.
    - |
      if [ -n "${AWS_ROLE_ARN:-}" ]; then
        AWS_WEB_IDENTITY_TOKEN_FILE="$(mktemp)"
        printf '%s' "$SIGCOMPLY_ID_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
        export AWS_WEB_IDENTITY_TOKEN_FILE
      fi

compliance:on_push:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - sigcomply check --pr

compliance:scheduled:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - sigcomply check --scheduled
    # Advisory only: lists manual-evidence entries whose folder for the
    # current period is still empty; until a file is uploaded, the matching
    # policy fails in every scheduled run. Read-only and always exits 0;
    # `|| true` keeps it from affecting the job even on a config error.
    - sigcomply evidence due --within-days 30 || true
