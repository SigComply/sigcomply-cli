# SigComply CLI - GitLab CI Example
#
# A hand-written GitLab CI pipeline for SigComply compliance checks. The
# recommended path is `sigcomply init-ci --ci gitlab`, which writes the
# same jobs plus an `evidence due` step in the daily job and pins the
# version of the CLI you ran it with.
#
# How it works:
#   - On every push to the default branch and every merge request, the
#     `compliance:on_push` job runs `sigcomply check --on-push`.
#   - Cadence jobs (daily/weekly/monthly/quarterly/annual) are driven by
#     GitLab pipeline schedules: create one schedule per cadence under
#     Settings → CI/CD → Pipeline schedules and set the `CADENCE`
#     variable to the matching value.
#
# The framework is read from `framework:` in `.sigcomply.yaml` — there is
# no `--framework` flag on `check`. Exit codes: 0 pass, 1 violations,
# 2 execution error, 3 config error. Violations fail the job by default;
# set `ci.fail_on_violation: false` in .sigcomply.yaml to keep it green.
#
# OIDC: `id_tokens` mints SIGCOMPLY_ID_TOKEN, a GitLab JWT with audience
# `https://api.sigcomply.com`. It is used twice:
#   - The CLI sends it to SigComply Cloud when `cloud.base_url:
#     https://sigcomply.com` is set in .sigcomply.yaml. Without that key
#     nothing is submitted.
#   - `before_script` writes it to a private temp file and exports
#     AWS_WEB_IDENTITY_TOKEN_FILE. With AWS_ROLE_ARN, the AWS SDK then
#     assumes that role with web identity. The IAM OIDC provider for your
#     GitLab host and the role's trust policy must accept the audience
#     `https://api.sigcomply.com`.
# Replace the AWS_ROLE_ARN placeholder below.

variables:
  # "latest" installs the newest release on every run. Pin a release tag
  # (vX.Y.Z, see https://github.com/SigComply/sigcomply-cli/releases) for
  # repeatable runs, and bump it when you upgrade.
  SIGCOMPLY_VERSION: "latest"
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::000000000000:role/REPLACE_ME"

.sigcomply_base:
  image: ubuntu:24.04
  id_tokens:
    SIGCOMPLY_ID_TOKEN:
      aud: https://api.sigcomply.com
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl jq ca-certificates tar
    - |
      version="${SIGCOMPLY_VERSION:-latest}"
      if [ "$version" = "latest" ]; then
        tag=$(curl -fsSL https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
      else
        tag="$version"
      fi
      ver="${tag#v}"
      curl -fsSL "https://github.com/SigComply/sigcomply-cli/releases/download/${tag}/sigcomply_${ver}_linux_amd64.tar.gz" -o /tmp/sigcomply.tar.gz
      tar -xzf /tmp/sigcomply.tar.gz -C /usr/local/bin sigcomply
      chmod +x /usr/local/bin/sigcomply
    # AWS web identity: the SDK's default credential chain assumes
    # AWS_ROLE_ARN with the token in this file. before_script and script
    # share one shell, so the export reaches `sigcomply`. The file is
    # created mode 0600 by mktemp; the token is never printed.
    - |
      AWS_WEB_IDENTITY_TOKEN_FILE="$(mktemp)"
      printf '%s' "$SIGCOMPLY_ID_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
      export AWS_WEB_IDENTITY_TOKEN_FILE

compliance:on_push:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - sigcomply check --on-push

compliance:daily:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CADENCE == "daily"'
  script:
    - sigcomply check --cadence daily

compliance:weekly:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CADENCE == "weekly"'
  script:
    - sigcomply check --cadence weekly

compliance:monthly:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CADENCE == "monthly"'
  script:
    - sigcomply check --cadence monthly

compliance:quarterly:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CADENCE == "quarterly"'
  script:
    - sigcomply check --cadence quarterly

compliance:annual:
  extends: .sigcomply_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CADENCE == "annual"'
  script:
    - sigcomply check --cadence annual
