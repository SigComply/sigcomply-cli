# Example: One compliance run across several AWS accounts (standalone workflow)
#
# SigComply ships no reusable workflow — this installs the released
# binary via curl and runs the CLI directly. One repo = one framework;
# the framework is read from `framework:` in .sigcomply.yaml.
#
# There is deliberately NO matrix here. Multi-account estates are
# expressed in .sigcomply.yaml as bracketed source instances, and one
# `sigcomply check` covers all of them — see the config sketch below.
#
# Why no matrix: every slot the shipped frameworks declare, except the
# roster slot (exactly one roster source), is `one-or-more`, so all
# instances union into a single evaluation. One run gives one result per
# policy over the whole estate, one vault run folder and one submission.
# A matrix gives three independent runs, each evaluating every policy on
# one account's data and each submitting separately: three partial
# results an auditor cannot combine into one.
#
# Per-account evidence stays independently verifiable either way: the
# instance key rides in `source_id` and in the envelope filename
# (`{evidence_type}__{source_id}.json`).
#
# Copy to .github/workflows/compliance-multi-account.yml. Cloud
# submission also needs `cloud.base_url: https://sigcomply.com` in
# .sigcomply.yaml; without it the CLI sends nothing. With it, also set
# `cloud.project_id` from your project's page on the SigComply dashboard.

name: Compliance — Multi-Account

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 02:00 UTC

permissions:
  id-token: write
  contents: read

env:
  # "latest" installs the newest release on every run. Pin a release tag
  # (vX.Y.Z, see https://github.com/SigComply/sigcomply-cli/releases) for
  # repeatable runs, and bump it when you upgrade.
  SIGCOMPLY_VERSION: latest
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::000000000000:role/REPLACE_ME   # the hub role

jobs:
  compliance:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SigComply CLI
        run: |
          set -eu
          version="${SIGCOMPLY_VERSION:-latest}"
          if [ "$version" = "latest" ]; then
            tag=$(curl -fsSL https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
          else
            tag="$version"
          fi
          ver="${tag#v}"
          asset="sigcomply_${ver}_linux_amd64.tar.gz"
          base="https://github.com/SigComply/sigcomply-cli/releases/download/${tag}"
          curl -fsSL "${base}/${asset}" -o "/tmp/${asset}"
          curl -fsSL "${base}/checksums.txt" -o /tmp/checksums.txt
          # Verify against the release's checksums before extracting anything.
          (cd /tmp && grep "  ${asset}\$" checksums.txt | sha256sum -c -)
          # Verify the build provenance (no token): the archive must have been
          # built by SigComply's release workflow on a GitHub-hosted runner,
          # from the commit the tag points at. A mismatch fails the job.
          bundle="sigcomply_${ver}_provenance.sigstore.json"
          curl -fsSL "${base}/${bundle}" -o "/tmp/${bundle}" \
            || { echo "${tag} has no ${bundle}: pin v0.91.0 or later" >&2; exit 1; }
          commit=$(git ls-remote https://github.com/SigComply/sigcomply-cli "refs/tags/${tag}^{}" | cut -f1)
          gh attestation verify "/tmp/${asset}" --bundle "/tmp/${bundle}" \
            --repo SigComply/sigcomply-cli --source-digest "${commit:?cannot resolve ${tag}}" \
            --cert-identity-regex '^https://github\.com/SigComply/sigcomply-cli/\.github/workflows/(auto-release-pipeline|release)\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$' \
            --deny-self-hosted-runners
          sudo tar -xzf "/tmp/${asset}" -C /usr/local/bin sigcomply

      # The runner holds ONE credential — its own OIDC role, the hub.
      # Each account's read-only audit role is assumed from there, via
      # the per-instance `role_arn` in .sigcomply.yaml. The spoke ARNs
      # are account identifiers, not secrets, so they live in the config
      # in version control rather than in repo secrets. The hub role is a
      # scheduled role: its trust policy accepts the audience
      # sts.amazonaws.com (never https://api.sigcomply.com, which is
      # SigComply Cloud's) and the main branch only.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Run SigComply
        run: sigcomply check

# ---------------------------------------------------------------------
# The .sigcomply.yaml side of this example. Full worked config:
#   docs/architecture/examples/multi-account.sigcomply.yaml
# Reference:
#   docs/configuration.md §Multiple instances of one source
#
#   sources:
#     "aws.iam[prod]":
#       region: us-east-1
#       role_arn: arn:aws:iam::111111111111:role/SigComplyAudit
#     "aws.s3[prod]":
#       region: us-east-1
#       role_arn: arn:aws:iam::111111111111:role/SigComplyAudit
#     "aws.iam[staging]":
#       region: us-east-1
#       role_arn: arn:aws:iam::222222222222:role/SigComplyAudit
#     "aws.iam[dev]":
#       region: us-west-2
#       role_arn: arn:aws:iam::333333333333:role/SigComplyAudit
#
#   # The part a matrix genuinely cannot express: name every instance
#   # that must be reached, so an account silently dropped from the
#   # config becomes a finding instead of silence.
#   experimental:
#     scope:
#       required_sources:
#         - "aws.iam[prod]"
#         - "aws.s3[prod]"
#         - "aws.iam[staging]"
#         - "aws.iam[dev]"
#
# Note: this pattern is AWS-specific. GCP and Azure instances vary WHAT
# is queried (project_id / subscription_id), not WHO asks — they share
# one ambient identity — so a "multi-subscription" variant is not
# symmetric with this one.
# ---------------------------------------------------------------------
