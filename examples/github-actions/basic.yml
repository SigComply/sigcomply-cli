# Example: Basic SigComply Compliance Check (standalone workflow)
#
# SigComply ships no reusable `workflow_call` workflow and no composite
# action. Integration is a standalone job that installs the released
# binary with curl and runs `sigcomply check`.
#
# This is a single-workflow alternative to `sigcomply init-ci`, which
# writes one workflow per cadence (`check --cadence <X>` / `--on-push`)
# plus an `evidence due` step. Prefer `init-ci` for a SOC 2 project. To
# use this file, copy it to .github/workflows/compliance.yml and edit the
# env block.

name: Compliance Check

on:
  push:
    branches: [main]
  pull_request:
  # Optional: also run on a schedule (daily at 02:00 UTC).
  schedule:
    - cron: '0 2 * * *'

permissions:
  # OIDC token for AWS role assumption and SigComply Cloud submission.
  # Submission also needs `cloud.base_url: https://sigcomply.com` in
  # .sigcomply.yaml; without it the CLI sends nothing.
  id-token: write
  contents: read

env:
  # "latest" installs the newest release on every run. Pin a release tag
  # (vX.Y.Z, see https://github.com/SigComply/sigcomply-cli/releases) for
  # repeatable runs, and bump it when you upgrade.
  SIGCOMPLY_VERSION: latest
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::000000000000:role/REPLACE_ME

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SigComply CLI
        run: |
          set -eu
          version="${SIGCOMPLY_VERSION:-latest}"
          if [ "$version" = "latest" ]; then
            tag=$(curl -fsSL https://api.github.com/repos/SigComply/sigcomply-cli/releases/latest | jq -r .tag_name)
          else
            tag="$version"
          fi
          ver="${tag#v}"
          curl -fsSL "https://github.com/SigComply/sigcomply-cli/releases/download/${tag}/sigcomply_${ver}_linux_amd64.tar.gz" -o /tmp/sigcomply.tar.gz
          tar -xzf /tmp/sigcomply.tar.gz -C /usr/local/bin sigcomply
          chmod +x /usr/local/bin/sigcomply
      # The token is minted with audience https://api.sigcomply.com, so the
      # IAM OIDC provider for token.actions.githubusercontent.com and the
      # role's trust policy must accept that audience.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: https://api.sigcomply.com
      - name: Run SigComply
        # Framework comes from `framework:` in .sigcomply.yaml (there is no
        # --framework flag on `check`). Exit code: 0 pass, 1 violations,
        # 2 execution error, 3 config error. Violations fail the job by
        # default; set `ci.fail_on_violation: false` in .sigcomply.yaml to
        # keep it green.
        run: sigcomply check
