# Vale prose linter. Run locally: `vale <file>` (everything) or
# `vale --minAlertLevel=error <file>` (what CI enforces on changed docs).
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = SigComply

[*.md]
BasedOnStyles = Vale, Google, SigComply

# --- Replaced by SigComply rules -------------------------------------------
# Vale.Spelling: replaced by SigComply.Spelling, which skips snake_case and
# camelCase identifiers and acronym plurals (PDFs, ARNs).
Vale.Spelling = NO
# Google.EmDash only objects to spaced dashes; SigComply.EmDash flags all em
# dashes (warning) because the goal is fewer dashes, not unspaced ones.
Google.EmDash = NO
# Google.LyHyphens fires on "SigComply-specific" (the name ends in "ly");
# SigComply.LyHyphens is the same rule with that and other -ly nouns excluded.
Google.LyHyphens = NO

# --- Off: fights this project's vocabulary or is mostly noise ---------------
# Google-product word list: "CLI" -> "command-line tool", "Cloud" -> "Google
# Cloud Platform". "SigComply CLI" and "SigComply Cloud" are our product names.
Google.WordList = NO
# "disabled" -> "turned off", "admin" -> "administrator", "application" -> "app".
# Cloud APIs and IAM use exactly these words for states and roles; rewording
# them makes the docs disagree with the consoles readers are looking at.
Google.WordListCase = NO
# Flags every unexpanded acronym (AWS, IAM, OIDC, SOC, ISO: ~800 hits in the
# CLI docs). The audience is engineers who read these daily.
Google.Acronyms = NO
# "Use parentheses judiciously" on every parenthesis (~650 hits); no signal.
Google.Parens = NO
# Wants punctuation inside quotes. Technical docs quote literal strings and
# messages, where moving the period inside changes the literal.
Google.Quotes = NO

# --- Kept, but not CI-blocking (error -> warning) ---------------------------
# "e.g." / "i.e." -> "for example" / "that is". Good advice, widely used here.
Google.Latin = warning
# Flags durations and status codes ("24h", "404s") as units missing a space.
Google.Units = warning
# "ID(s)": fair, but not worth a red build.
Google.OptionalPlurals = warning
# "Thanks for contributing!" in CONTRIBUTING files.
Google.Exclamation = warning
