# PROVENANCE — NOT RECORDED AGAINST A LIVE TENANT.
#
# SigComply has no AWS IAM Identity Center tenant, so this cassette could not
# be recorded from real traffic. It was CONSTRUCTED:
#
#   * the REQUEST side (URL, method, X-Amz-Target, body) is genuine — produced
#     by driving the real aws-sdk-go-v2 identitystore + ssoadmin clients, whose
#     serializers are generated from the published Smithy models
#     (aws/aws-sdk-go-v2 codegen/sdk-codegen/aws-models/{identitystore,sso-admin}.json),
#     through a canned transport while go-vcr recorded.
#   * the RESPONSE bodies are hand-transcribed from those same service models'
#     User / InstanceMetadata / PermissionSet / AccountAssignment shapes
#     (awsJson1_1: epoch-second timestamps).
#
# It therefore proves the plugin's mapping against the SHAPE the model declares,
# not against what a real tenant returns. Re-record it against a live Identity
# Center instance before treating it as a contract test. Identities use the
# house placeholders (docs/architecture/11-testing-strategy.md §4).
#
# REGENERATING IT is no longer a feat of memory — the construction procedure is
# identitycenter_cassette_test.go (build tag `cassette`), which holds every
# transcribed response body:
#
#   rm -f internal/sources/aws/identitycenter/testdata/cassettes/identity_store_users.yaml
#   go test -tags cassette -run TestConstructCassette ./internal/sources/aws/identitycenter/
#
# go-vcr writes the YAML and drops leading comments, so paste this block back
# afterwards.
#
# The fixture models one estate: three users (Ada, Dana, and one with no
# email), two permission sets, one AWS account. AdministratorAccess is held by
# the group "Platform Admins", whose only member is Ada — so Ada is is_admin
# through group membership while the iam_binding for that grant stays a GROUP
# principal. Dana holds ReadOnly directly.
